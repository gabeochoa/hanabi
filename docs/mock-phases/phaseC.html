<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hanabi — Phase C</title>
<style>
/* ============================================================
   THEME TOKENS — single swappable set (mirrors the C++ plan)
   ============================================================ */
:root {
  /* dark palette (anchor) */
  --bg: rgb(28,28,32);
  --sidebar-bg: rgb(22,22,26);
  --panel-bg: rgb(28,28,32);
  --panel-bg-2: rgb(34,34,40);
  --border: rgb(52,52,60);
  --border-soft: rgba(255,255,255,0.05);
  --text-primary: rgb(222,222,228);
  --text-secondary: rgb(138,138,150);
  --text-faint: rgb(96,96,108);
  --accent: rgb(90,128,255);
  --accent-soft: rgba(90,128,255,0.15);
  --role-user: rgb(90,128,255);
  --role-assistant: rgb(126,200,140);
  --role-system: rgb(180,150,90);
  --role-tool: rgb(150,130,200);
  --selected-bg: rgb(48,66,120);
  --hover-bg: rgba(255,255,255,0.045);
  --dot: rgb(90,128,255);
  --tag-blocked-fg: rgb(255,120,120);
  --tag-blocked-bg: rgba(255,90,90,0.14);
  --tag-ready-fg: rgb(126,210,150);
  --tag-ready-bg: rgba(120,210,140,0.14);
  --tag-done-fg: rgb(120,160,255);
  --tag-done-bg: rgba(90,128,255,0.16);
  --code-bg: rgb(18,18,22);
  --shadow: rgba(0,0,0,0.45);
  --composer-bg: rgb(34,34,40);
  --traffic-red:#ff5f57; --traffic-yellow:#febc2e; --traffic-green:#28c840;
  --macbar-bg: rgba(30,30,34,0.72); --macbar-border: rgba(255,255,255,0.08);
  --macbar-text: rgba(255,255,255,0.92); --macbar-hover: rgba(255,255,255,0.14);
  --dot-grid: rgba(255,255,255,0.05);
}

[data-theme="light"] {
  --bg: rgb(244,244,247);
  --sidebar-bg: rgb(236,236,240);
  --panel-bg: rgb(252,252,253);
  --panel-bg-2: rgb(246,246,249);
  --border: rgb(216,216,222);
  --border-soft: rgba(0,0,0,0.05);
  --text-primary: rgb(34,34,42);
  --text-secondary: rgb(120,120,132);
  --text-faint: rgb(168,168,178);
  --accent: rgb(58,102,248);
  --accent-soft: rgba(58,102,248,0.12);
  --role-user: rgb(58,102,248);
  --role-assistant: rgb(46,150,80);
  --role-system: rgb(168,128,40);
  --role-tool: rgb(126,96,196);
  --selected-bg: rgb(214,226,255);
  --hover-bg: rgba(0,0,0,0.04);
  --dot: rgb(58,102,248);
  --tag-blocked-fg: rgb(200,44,44);
  --tag-blocked-bg: rgba(220,60,60,0.12);
  --tag-ready-fg: rgb(30,140,66);
  --tag-ready-bg: rgba(40,160,80,0.14);
  --tag-done-fg: rgb(48,92,224);
  --tag-done-bg: rgba(58,102,248,0.12);
  --code-bg: rgb(240,240,244);
  --shadow: rgba(0,0,0,0.16);
  --composer-bg: rgb(248,248,250);
  --macbar-bg: rgba(245,245,247,0.72); --macbar-border: rgba(0,0,0,0.10);
  --macbar-text: rgba(0,0,0,0.82); --macbar-hover: rgba(0,0,0,0.08);
  --dot-grid: rgba(0,0,0,0.055);
}

* { box-sizing: border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
    "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: transparent;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  font-size: 13px;
  line-height: 1.5;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  min-height:100vh;
  padding: 0;
  background:
    radial-gradient(1200px 800px at 20% -10%, rgba(90,128,255,0.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 120%, rgba(126,200,140,0.06), transparent 55%),
    #0d0d10;
}
[data-theme="light"] body {
  background:
    radial-gradient(1200px 800px at 20% -10%, rgba(58,102,248,0.10), transparent 60%),
    radial-gradient(1000px 700px at 110% 120%, rgba(46,150,80,0.05), transparent 55%),
    #c9cad0;
}

/* ============================================================
   WINDOW CHROME
   ============================================================ */
.window {
  width: 1180px;
  height: 760px;
  max-width: 100%;
  max-height: calc(100vh - 76px);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 24px 60px var(--shadow), 0 2px 6px rgba(0,0,0,0.3);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.titlebar {
  height: 38px;
  flex: 0 0 38px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
  background: var(--sidebar-bg);
  gap: 12px;
  -webkit-user-select: none; user-select:none;
}
.traffic { display:flex; gap:8px; align-items:center; }
.traffic .light { width:12px; height:12px; border-radius:50%; }
.traffic .red{background:var(--traffic-red);}
.traffic .yellow{background:var(--traffic-yellow);}
.traffic .green{background:var(--traffic-green);}
.titlebar .title {
  flex:1; text-align:center; font-weight:600; font-size:12.5px;
  color: var(--text-secondary); letter-spacing:0.2px;
}
.titlebar .title b { color: var(--text-primary); font-weight:700; }
.titlebar-actions { display:flex; gap:6px; align-items:center; }
.iconbtn {
  width: 28px; height:26px; border-radius:7px; border:1px solid transparent;
  background: transparent; color: var(--text-secondary);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition: background .12s, color .12s;
}
.iconbtn:hover { background: var(--hover-bg); color: var(--text-primary); }
.iconbtn svg { width:16px; height:16px; }

/* ============================================================
   BODY LAYOUT
   ============================================================ */
.body { flex:1; display:flex; min-height:0; }

/* ---------- SIDEBAR ---------- */
.sidebar {
  flex: 0 0 280px;
  width: 280px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width .18s ease, flex-basis .18s ease;
  overflow: hidden;
}
.window.folded .sidebar { flex-basis: 52px; width:52px; }

/* sidebar header: brand + action icons (new task, settings, collapse) */
.sb-header {
  display:flex; align-items:center; gap:4px;
  padding: 9px 8px 5px 14px; min-height:40px; box-sizing:border-box;
}
.sb-brand { display:flex; align-items:center; gap:7px; flex:1; min-width:0; }
.sb-mark { color: var(--accent); font-size:15px; line-height:1; }
.sb-brandname {
  font-size:13.5px; font-weight:700; color: var(--text-primary);
  letter-spacing:0.2px; white-space:nowrap;
}
.sb-actions { display:flex; align-items:center; gap:1px; flex:0 0 auto; }
.sb-actions .iconbtn {
  width:26px; height:26px; border-radius:7px; color: var(--text-faint);
}
.sb-actions .iconbtn:hover { background: var(--hover-bg); color: var(--text-primary); }
.sb-actions .iconbtn svg { width:16px; height:16px; }
.sb-collapse .ic-unfold { display:none; }
/* folded: stack the action icons vertically in the thin rail, hide brand,
   flip the collapse chevron to an expand chevron */
.window.folded .sb-header {
  flex-direction:column; gap:2px; padding:9px 0 5px; min-height:0;
}
.window.folded .sb-brand { display:none; }
.window.folded .sb-actions { flex-direction:column; gap:2px; }
.window.folded .sb-collapse { order:-1; }   /* expand toggle on top in the rail */
.window.folded .sb-collapse .ic-fold { display:none; }
.window.folded .sb-collapse .ic-unfold { display:block; }

/* search */
.sb-top { padding: 10px 10px 6px; }
.search {
  display:flex; align-items:center; gap:6px;
  background: var(--panel-bg-2); border:1px solid var(--border);
  border-radius:8px; padding: 5px 8px;
}
.search svg { width:13px; height:13px; color:var(--text-faint); flex:0 0 auto; }
.search input {
  border:none; background:transparent; outline:none; color:var(--text-primary);
  font-size:12.5px; width:100%; font-family:inherit;
}
.search input::placeholder { color: var(--text-faint); }
.window.folded .search { justify-content:center; padding:6px; }
.window.folded .search input { display:none; }

/* smart views */
.sb-section-label {
  font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px;
  color: var(--text-faint); font-weight:600; padding: 10px 14px 5px;
}
.window.folded .sb-section-label { display:none; }

.smart-list { padding: 0 8px; }
.smart-item {
  display:flex; align-items:center; gap:10px;
  padding: 6px 8px; border-radius:8px; cursor:pointer; color: var(--text-secondary);
  position:relative; transition: background .1s;
}
.smart-item:hover { background: var(--hover-bg); color: var(--text-primary); }
.smart-item.active { background: var(--selected-bg); color: var(--text-primary); }
.smart-item .ic { width:18px; height:18px; flex:0 0 18px; display:flex; align-items:center; justify-content:center; }
.smart-item .ic svg { width:16px; height:16px; }
.smart-item .lbl { flex:1; font-size:13px; font-weight:500; white-space:nowrap; }
.smart-item .cnt {
  font-size:11px; color: var(--text-faint); font-variant-numeric: tabular-nums;
  min-width:16px; text-align:right;
}
.smart-item.active .cnt { color: var(--text-primary); }
.window.folded .smart-item .lbl, .window.folded .smart-item .cnt { display:none; }
.window.folded .smart-item { justify-content:center; padding:8px 0; margin: 2px 4px; }

/* badge on folded rail */
.rail-badge {
  position:absolute; top:2px; right:6px;
  background: var(--tag-blocked-fg); color:#fff;
  font-size:9px; font-weight:700; min-width:15px; height:15px; line-height:15px;
  border-radius:8px; text-align:center; padding:0 3px; display:none;
}
.window.folded .smart-item .rail-badge { display:block; }

/* folders + chats (unfolded only) */
.sb-scroll { flex:1; overflow-y:auto; overflow-x:hidden; }
.window.folded .sb-scroll { overflow:hidden; }
.window.folded .folders, .window.folded .recent-chats { display:none; }

.folder-group { padding: 0 8px; }
.folder-head {
  display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:7px;
  cursor:pointer; color: var(--text-secondary); font-size:12px; font-weight:600;
}
.folder-head:hover { background: var(--hover-bg); }
.folder-head .chev { width:12px; height:12px; transition: transform .12s; flex:0 0 12px; }
.folder-head.collapsed .chev { transform: rotate(-90deg); }
.folder-head .fico { width:13px; height:13px; flex:0 0 13px; color: var(--text-faint); }
.archived-group { margin-top:4px; }
.archived-group .fname { color: var(--text-faint); }
.folder-head .fname { flex:1; }
.folder-head .fcount { font-size:11px; color:var(--text-faint); font-weight:500; }
.folder-head .fcount.attn { color: var(--accent); font-weight:700; }
.folder-body { overflow:hidden; padding-left: 14px; margin-left: 13px; border-left: 1px solid var(--border); }
.folder-head.collapsed + .folder-body { display:none; }

/* chat row */
.chat-row {
  display:flex; align-items:center; gap:8px; padding:3px 8px 3px 10px;
  border-radius:6px; cursor:pointer; color: var(--text-secondary);
  transition: background .1s; line-height:1.25;
}
.chat-row:hover { background: var(--hover-bg); }
/* status glyph — a DEDICATED SHAPE per status (not color-only), shown only
   when the thread needs attention (waiting/blocked/review/done). Self-running,
   parked and archived show nothing. */
.chat-row .glyph { width:9px; height:9px; flex:0 0 9px; margin-left:1px; position:relative; display:none; }
.chat-row.has-glyph .glyph { display:block; }
/* blocked = red UP-TRIANGLE (most urgent) */
.glyph.g-blocked { width:0; height:0; background:transparent;
  border-left:5px solid transparent; border-right:5px solid transparent;
  border-bottom:9px solid var(--tag-blocked-fg); }
/* review = green DIAMOND (agent-verified, ready to look) */
.glyph.g-review { width:8px; height:8px; background: var(--tag-ready-fg); transform: rotate(45deg); border-radius:1px; }
/* done = blue DOT (finished) */
.glyph.g-done { width:8px; height:8px; background: var(--tag-done-fg); border-radius:50%; }
/* working = HOLLOW ring (a sub-agent is running) — outline, not filled */
.glyph.g-working { display:block !important; width:9px; height:9px;
  background:transparent; border:1.6px solid var(--text-faint); border-radius:50%;
  box-sizing:border-box; animation: ring-pulse 1.6s ease-in-out infinite; }
@keyframes ring-pulse { 0%,100%{ opacity:.45 } 50%{ opacity:1 } }
/* the working ring on a parent row sits just right of the status shape */
.chat-row .glyph.g-working { flex:0 0 9px; margin-left:-2px; border-color: var(--accent); }

/* ---- sub-agents (nested, collapsed by default) ---- */
.chat-item {}
.subtoggle { width:13px; height:13px; flex:0 0 13px; display:flex; align-items:center; justify-content:center;
  color: var(--text-faint); cursor:pointer; border-radius:4px; }
.subtoggle:hover { color: var(--text-primary); background: var(--hover-bg); }
.subtoggle .chev { width:11px; height:11px; transition: transform .12s; }
.chat-item.collapsed .subtoggle .chev { transform: rotate(-90deg); }
.subtoggle-spacer { width:13px; flex:0 0 13px; }   /* align rows without subs */
.subcount { font-size:10px; color: var(--text-faint); font-variant-numeric:tabular-nums;
  min-width:14px; text-align:right; flex:0 0 auto; }
.subrows { padding-left: 22px; }
.chat-item.collapsed .subrows { display:none; }
.subrow { display:flex; align-items:center; gap:7px; padding:2px 8px 2px 4px; border-radius:6px;
  cursor:pointer; color: var(--text-faint); position:relative; line-height:1.2; }
.subrow:hover { background: var(--hover-bg); }
.subrow .subtwig { width:8px; height:1px; background: var(--border); flex:0 0 8px; }
.subrow .ctitle { flex:1; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color: var(--text-faint); }
.subrow.running .ctitle { color: var(--text-secondary); }
.subrow.done .ctitle { color: var(--text-faint); }
.subrow .glyph { width:8px; height:8px; flex:0 0 8px; }
.chat-row .ctitle {
  flex:1; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  color: var(--text-secondary);
}
.chat-row.attn .ctitle { font-weight:700; color: var(--text-primary); }
.chat-row.running .ctitle { color: var(--text-faint); }        /* dimmed, calm */
.chat-row.parked { opacity:0.42; }
.chat-row.parked .ctitle { color: var(--text-faint); }
.tag {
  font-size:9.5px; font-weight:700; padding:1px 6px; border-radius:5px;
  letter-spacing:0.3px; flex:0 0 auto; text-transform:uppercase;
}
.tag.blocked { color:var(--tag-blocked-fg); background:var(--tag-blocked-bg); }
.tag.ready { color:var(--tag-ready-fg); background:var(--tag-ready-bg); }
.tag.done { color:var(--tag-done-fg); background:var(--tag-done-bg); }

.recent-label { margin-top:4px; }

/* All Folders overview */
.folder-ov { margin-bottom: 22px; }
.folder-ov-head {
  display:flex; align-items:center; gap:8px; margin-bottom:10px;
  padding-bottom:6px; border-bottom:1px solid var(--border);
}
.folder-ov-head .fo-name { font-size:14px; font-weight:700; color:var(--text-primary); flex:1; }
.folder-ov-head .fo-count { font-size:12px; color:var(--text-faint); font-variant-numeric:tabular-nums; }
.folder-ov-head .fo-badge {
  font-size:11px; font-weight:700; color:#fff; background:var(--accent);
  border-radius:6px; padding:2px 8px;
}

/* keep search hidden in folded rail */
.window.folded .sb-top { display:none; }

/* ---------- MAIN ---------- */
.main { flex:1; display:flex; flex-direction:column; min-width:0; background: var(--bg); }

/* tab strip */
.tabstrip {
  flex:0 0 38px; height:38px; display:flex; align-items:stretch;
  border-bottom:1px solid var(--border); background: var(--sidebar-bg);
  overflow-x:auto; overflow-y:hidden;
}
.tabstrip::-webkit-scrollbar { height:0; }
.tab {
  display:flex; align-items:center; gap:8px; padding: 0 12px;
  border-right:1px solid var(--border); cursor:pointer; color: var(--text-secondary);
  font-size:12.5px; max-width:220px; position:relative; white-space:nowrap; flex:0 0 auto;
}
.tab:hover { background: var(--hover-bg); }
.tab.active { background: var(--bg); color: var(--text-primary); }
.tab.active::after {
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background: var(--accent);
}
.tab .tt { max-width:160px; overflow:hidden; text-overflow:ellipsis; }
.tab .tclose {
  width:16px; height:16px; border-radius:4px; display:flex; align-items:center; justify-content:center;
  color: var(--text-faint); flex:0 0 16px;
}
.tab .tclose:hover { background: var(--hover-bg); color: var(--text-primary); }
.tab .tclose svg { width:10px; height:10px; }
.tab-add {
  display:flex; align-items:center; justify-content:center; width:34px; flex:0 0 34px;
  cursor:pointer; color: var(--text-faint);
}
.tab-add:hover { color: var(--text-primary); background: var(--hover-bg); }
.tab-add svg { width:14px; height:14px; }

/* content area */
.content { flex:1; min-height:0; position:relative; }
.screen { position:absolute; inset:0; display:none; flex-direction:column; }
.screen.active { display:flex; }

/* ---------- TRANSCRIPT ---------- */
.transcript-head {
  flex:0 0 auto; padding:12px 20px 10px; border-bottom:1px solid var(--border-soft);
  display:flex; align-items:center; gap:10px;
}
.transcript-head h2 { font-size:14px; font-weight:700; color:var(--text-primary); }
.transcript-head .sub { font-size:11.5px; color:var(--text-secondary); }
.transcript { flex:1; overflow-y:auto; padding: 16px 20px 8px; }
.msg { display:flex; gap:12px; margin-bottom:18px; max-width:760px; }
.msg .avatar {
  width:26px; height:26px; border-radius:7px; flex:0 0 26px; margin-top:1px;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff;
}
.msg.user .avatar{ background: var(--role-user); }
.msg.assistant .avatar{ background: var(--role-assistant); }
.msg.tool .avatar{ background: var(--role-tool); }
.msg.system .avatar{ background: var(--role-system); }
.msg .bubble { flex:1; min-width:0; }
.msg .meta { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.msg .role { font-size:11px; font-weight:700; letter-spacing:0.2px; }
.msg.user .role{ color: var(--role-user); }
.msg.assistant .role{ color: var(--role-assistant); }
.msg.tool .role{ color: var(--role-tool); }
.msg.system .role{ color: var(--role-system); }
.msg .ts { font-size:10.5px; color: var(--text-faint); }
.msg .text { color: var(--text-primary); font-size:13px; }
.msg .text p { margin-bottom:7px; }
.msg .text ul { margin: 4px 0 8px 18px; }
.msg .text li { margin-bottom:3px; }
.msg.tool .text, .msg.system .text { color: var(--text-secondary); font-size:12.5px; }
.codeblock {
  background: var(--code-bg); border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; font-family: "SF Mono", ui-monospace, Menlo, monospace;
  font-size:12px; color: var(--text-primary); overflow-x:auto; margin:6px 0 8px; line-height:1.55;
}
.codeblock .cm { color: var(--text-faint); }
.codeblock .kw { color: var(--role-user); }
.codeblock .st { color: var(--role-assistant); }

/* composer */
.composer {
  flex:0 0 auto; border-top:1px solid var(--border); padding:10px 16px; display:flex; gap:10px; align-items:flex-end;
  background: var(--panel-bg);
}
.composer .field {
  flex:1; background: var(--composer-bg); border:1px solid var(--border); border-radius:10px;
  padding:9px 12px; color: var(--text-primary); font-family:inherit; font-size:13px;
  resize:none; outline:none; min-height:38px; max-height:120px; line-height:1.4;
}
.composer .field::placeholder { color: var(--text-faint); }
.composer .field:focus { border-color: var(--accent); }
.send-btn {
  background: var(--accent); border:none; color:#fff; border-radius:9px; height:38px; width:38px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 38px;
}
.send-btn:hover { filter:brightness(1.08); }
.send-btn svg { width:16px; height:16px; }

/* ---------- SMART VIEW SCREENS ---------- */
.sv {
  flex:1; overflow-y:auto; padding: 26px 34px;
  background-image: radial-gradient(var(--dot-grid) 1.2px, transparent 1.2px);
  background-size: 22px 22px; background-position: -1px -1px;
}
.sv-wrap { max-width: 720px; margin:0 auto; }
.sv h1 { font-size:20px; font-weight:700; margin-bottom:2px; }
.sv .sv-sub { color: var(--text-secondary); font-size:12.5px; margin-bottom:22px; }
.sv h3 {
  font-size:12px; text-transform:uppercase; letter-spacing:0.6px; color: var(--text-secondary);
  font-weight:700; margin: 26px 0 10px;
}
.sv h3:first-of-type { margin-top:0; }

/* numbered digest list */
.digest { list-style:none; counter-reset: d; }
.digest li {
  counter-increment:d; display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--border-soft);
  align-items:flex-start;
}
.digest li::before {
  content: counter(d); flex:0 0 22px; width:22px; height:22px; border-radius:50%;
  background: var(--accent-soft); color: var(--accent); font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}

.digest .daction { flex:0 0 auto; }
.mini-btn {
  background: transparent; border:1px solid var(--border); color: var(--text-primary);
  border-radius:7px; padding:5px 11px; font-size:11.5px; font-weight:600; cursor:pointer; font-family:inherit;
  white-space:nowrap;
}

/* finished list */

  list-style:none; border-bottom:1px solid var(--border-soft);
}
.finished .fcheck { color: var(--role-assistant); flex:0 0 auto; }
.finished .fname { color: var(--text-primary); font-weight:600; }
.finished .fago { margin-left:auto; color: var(--text-faint); font-size:11px; }

/* pinned to digest (user-chosen always-surface items) */
.pinned { list-style:none; }
.pinned li {
  display:flex; gap:10px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--border-soft);
}
.pinned .pin-dot { flex:0 0 auto; font-size:11px; opacity:0.65; line-height:1.3; }
.pinned .pinfo { flex:1; min-width:0; }
.pinned .ptitle { font-size:13px; font-weight:600; color: var(--text-primary); }
.pinned .pctx { font-size:12px; color: var(--text-secondary); margin-top:2px; }
.pinned .unpin {
  flex:0 0 auto; background:transparent; border:none; color: var(--text-faint);
  font-size:15px; line-height:1; cursor:pointer; padding:2px 4px; border-radius:5px; font-family:inherit;
}
.pinned .unpin:hover { background: var(--hover-bg); color: var(--text-secondary); }

/* self-running collapsed */
.selfrun-head {
  display:flex; align-items:center; gap:8px; cursor:pointer; color: var(--text-faint);
  font-size:12px; text-transform:uppercase; letter-spacing:0.6px; font-weight:700; margin-top:26px;
}
.selfrun-head .chev { width:12px; height:12px; transition:transform .12s; }
.selfrun-head.collapsed .chev { transform: rotate(-90deg); }
.selfrun-body { margin-top:8px; }
.selfrun-head.collapsed + .selfrun-body { display:none; }
.selfrun-row {
  display:flex; align-items:center; gap:10px; padding:5px 0; color: var(--text-faint); font-size:12px;
}
.selfrun-row .spin {
  width:11px; height:11px; border:2px solid var(--text-faint); border-top-color:transparent;
  border-radius:50%; animation: spin 1s linear infinite; flex:0 0 11px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* blocked / ready card rows */
.card {
  border:1px solid var(--border); background: var(--panel-bg-2); border-radius:10px;
  padding:14px 16px; margin-bottom:12px;
}
.card .chead { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.card .cname { font-size:13.5px; font-weight:700; flex:1; }
.card .cneed {
  font-size:12px; color: var(--text-secondary); margin-bottom:4px;
}
.card .cneed b { color: var(--text-primary); }
.card .cctx { font-size:12px; color: var(--text-secondary); margin-bottom:12px; }
.card .cactions { display:flex; gap:8px; }
.card .steps { list-style:none; margin:6px 0 12px; }
.card .steps li { font-size:12px; color: var(--text-secondary); padding:3px 0 3px 20px; position:relative; }
.card .steps li::before {
  content:''; position:absolute; left:4px; top:8px; width:6px; height:6px; border-radius:50%;
  background: var(--role-assistant);
}
.checkpass { color: var(--role-assistant); font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:5px; }
.checkpass svg { width:13px; height:13px; }
.reviewnote { font-size:12.5px; color: var(--text-secondary); line-height:1.55; margin:8px 0 12px; }

}

}

/* ============================================================
   MENU-BAR POPOVER
   ============================================================ */
.menubar-pop {
  position:absolute; top:44px; right:14px; width: 300px; z-index:40;
  background: var(--panel-bg); border:1px solid var(--border); border-radius:12px;
  box-shadow: 0 20px 50px var(--shadow); overflow:hidden; display:none;
}

.menubar-pop::before {
  content:''; position:absolute; top:-6px; right:26px; width:12px; height:12px;
  background: var(--panel-bg); border-left:1px solid var(--border); border-top:1px solid var(--border);
  transform: rotate(45deg);
}
.mb-head { padding:12px 14px 8px; font-size:12px; font-weight:700; color: var(--text-primary); }

/* scrollbars */
::-webkit-scrollbar { width:9px; height:9px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius:6px; border:2px solid transparent;
  background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: padding-box; }

/* tooltip (folded rail) */
[data-tip] { position:relative; }
.window.folded [data-tip]:hover::after {

}

/* stage that holds the app window under the system bar */
.stage { flex:1; width:100%; display:flex; align-items:flex-start; justify-content:center;
  padding: 26px 24px 24px; box-sizing:border-box; }

/* menu-bar EXTRA popover: anchored under the status item, top-right of screen */

/* ===== Settings modal ===== */
.settings {

  background:#fff; border-radius:50%; transition:.15s; }

.phase-caption {

// How many threads in a set are waiting on the user (attn/done + not parked).
function waitingCount(ids){
  return ids.filter(id=>{ const t=THREADS[id]; return (t.state==="attn"||t.state==="done"); }).length;
}


const TAG_LABEL = { blocked:"Blocked", ready:"Review", done:"Done" };
function chatRowHtml(id){
  const t = THREADS[id];
  let cls = "chat-row";
  let glyph = "";
  if(t.tag==="blocked"){ cls+=" attn has-glyph"; glyph='<span class="glyph g-blocked"></span>'; }
  else if(t.tag==="ready"){ cls+=" attn has-glyph"; glyph='<span class="glyph g-review"></span>'; }
  else if(t.state==="done"||t.tag==="done"){ cls+=" attn has-glyph"; glyph='<span class="glyph g-done"></span>'; }
  else if(t.state==="attn"){ cls+=" attn has-glyph"; glyph='<span class="glyph g-blocked"></span>'; }
  else if(t.state==="running") cls+=" running";
  else if(t.state==="parked"||t.state==="archived") cls+=" parked";
  return '<div class="chat-item">'+
    '<div class="'+cls+'">'+ glyph +
      '<span class="ctitle">'+t.title+'</span>'+
    '</div></div>';
}
function toggleFolder(el){ el.classList.toggle('collapsed'); }
function renderSidebar(){
  document.querySelectorAll('[data-chats]').forEach(function(el){
    const key = el.getAttribute('data-chats');
    const ids = FOLDER_MEMBERS[key] || [];
    el.innerHTML = ids.map(chatRowHtml).join('');
  });
  document.querySelectorAll('.folder-group').forEach(function(g){
    const body = g.querySelector('.folder-body'); if(!body) return;
    const key = body.getAttribute('data-chats');
    const ids = FOLDER_MEMBERS[key] || [];
    const w = waitingCount(ids);
    const cnt = g.querySelector('.fcount'); if(!cnt) return;
    if(w>0){ cnt.textContent = w+" waiting"; cnt.classList.add('attn'); }
    else   { cnt.textContent = ids.length; cnt.classList.remove('attn'); }
  });

  if(ac) ac.textContent = (FOLDER_MEMBERS.archived||[]).length;
}
