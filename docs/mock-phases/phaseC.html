<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hanabi — Phase C</title>
<link rel="stylesheet" href="../../mock/assets/hanabi.css">
<style>
/* phase-specific overrides on top of shared hanabi.css (this phase is a design SNAPSHOT — it predates some hanabi.css changes, so these rules keep its exact look) */
.titlebar .title {
  flex:1; text-align:center; font-weight:600; font-size:12.5px;
  color: var(--text-secondary); letter-spacing:0.2px;
}
.titlebar .title b { color: var(--text-primary); font-weight:700; }
/* sidebar header: brand + action icons (new task, settings, collapse) */
.sb-header {
  display:flex; align-items:center; gap:4px;
  padding: 9px 8px 5px 14px; min-height:40px; box-sizing:border-box;
}
.sb-brand { display:flex; align-items:center; gap:7px; flex:1; min-width:0; }
.sb-mark { color: var(--accent); font-size:15px; line-height:1; }
.sb-brandname {
  font-size:13.5px; font-weight:700; color: var(--text-primary);
  letter-spacing:0.2px; white-space:nowrap;
}
.sb-actions .iconbtn {
  width:26px; height:26px; border-radius:7px; color: var(--text-faint);
}
/* folded: stack the action icons vertically in the thin rail, hide brand,
   flip the collapse chevron to an expand chevron */
.window.folded .sb-header {
  flex-direction:column; gap:2px; padding:9px 0 5px; min-height:0;
}
.window.folded .sb-brand { display:none; }
/* search */
.sb-top { padding: 10px 10px 6px; }
.search {
  display:flex; align-items:center; gap:6px;
  background: var(--panel-bg-2); border:1px solid var(--border);
  border-radius:8px; padding: 5px 8px;
}
/* chat row */
.chat-row {
  display:flex; align-items:center; gap:8px; padding:3px 8px 3px 10px;
  border-radius:6px; cursor:pointer; color: var(--text-secondary);
  transition: background .1s; line-height:1.25;
}
/* status glyph — a DEDICATED SHAPE per status (not color-only), shown only
   when the thread needs attention (waiting/blocked/review/done). Self-running,
   parked and archived show nothing. */
.chat-row .glyph { width:9px; height:9px; flex:0 0 9px; margin-left:1px; position:relative; display:none; }
.chat-row.has-glyph .glyph { display:block; }
/* pin folder-body inset to this snapshot's original look (insulated from the reduced-indent change in shared hanabi.css) */
.folder-body { padding-left: 6px; margin-left: 7px; }
/* the working ring on a parent row sits just right of the status shape */
.chat-row .glyph.g-working { flex:0 0 9px; margin-left:-2px; border-color: var(--accent); }
/* ---- sub-agents (nested, collapsed by default) ---- */
.chat-item {}
.subtoggle { width:13px; height:13px; flex:0 0 13px; display:flex; align-items:center; justify-content:center;
  color: var(--text-faint); cursor:pointer; border-radius:4px; }
.subtoggle:hover { color: var(--text-primary); background: var(--hover-bg); }
.subtoggle .chev { width:11px; height:11px; transition: transform .12s; }
.chat-item.collapsed .subtoggle .chev { transform: rotate(-90deg); }
.subtoggle-spacer { width:13px; flex:0 0 13px; }
/* align rows without subs */
.subcount { font-size:10px; color: var(--text-faint); font-variant-numeric:tabular-nums;
  min-width:14px; text-align:right; flex:0 0 auto; }
.subrows { padding-left: 22px; }
.chat-item.collapsed .subrows { display:none; }
.subrow { display:flex; align-items:center; gap:7px; padding:2px 8px 2px 4px; border-radius:6px;
  cursor:pointer; color: var(--text-faint); position:relative; line-height:1.2; }
.subrow:hover { background: var(--hover-bg); }
.subrow .subtwig { width:8px; height:1px; background: var(--border); flex:0 0 8px; }
.subrow .ctitle { flex:1; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color: var(--text-faint); }
.subrow.running .ctitle { color: var(--text-secondary); }
.subrow.done .ctitle { color: var(--text-faint); }
.subrow .glyph { width:8px; height:8px; flex:0 0 8px; }
/* keep search hidden in folded rail */
.window.folded .sb-top { display:none; }
.phase-caption {
  position: fixed; left: 10px; bottom: 8px; z-index: 500;
  font-size: 10px; color: rgba(255,255,255,0.32); letter-spacing:0.3px;
  font-family: ui-monospace, Menlo, monospace; -webkit-user-select:none; user-select:none;
}
[data-theme="light"] .phase-caption { color: rgba(0,0,0,0.30); }
.statusbar {
  height:26px; flex:0 0 26px; display:flex; align-items:center; justify-content:space-between;
  padding:0 12px; border-top:1px solid var(--border); background:var(--sidebar-bg);
  font-size:11px; color:var(--text-secondary); -webkit-user-select:none; user-select:none;
}
</style>
</head>
<body>
<div class="macbar">
  <div class="macbar-left">
     <span class="apple"></span>
     <span class="macbar-app">hanabi</span>
     <span class="macbar-menu">File</span>
     <span class="macbar-menu">Edit</span>
     <span class="macbar-menu">View</span>
     <span class="macbar-menu">Window</span>
     <span class="macbar-menu">Help</span>
  </div>
  <div class="macbar-right">
     <span class="macbar-sys">100%</span>
     <span class="macbar-sys">Thu 1:58 PM</span>
  </div>
</div>

<div class="stage">
<div class="window" id="window">
  <div class="titlebar">
    <div class="traffic">
      <span class="light red"></span><span class="light yellow"></span><span class="light green"></span>
    </div>
    <div class="title"><b>hanabi</b></div>
  </div>
  <div class="body">
    <div class="sidebar">
      <div class="sb-header">
        <span class="sb-brand"><span class="sb-mark">✦</span><span class="sb-brandname">hanabi</span></span>
        <div class="sb-actions">
          <button class="iconbtn" data-tip="New task" title="New task">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="iconbtn" data-tip="Settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 6.8 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 5 13.6a1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 5 6.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10.4 5 1.6 1.6 0 0 0 11.5 3.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
          </button>
          <button class="iconbtn sb-collapse" id="collapseBtn" title="Toggle sidebar (Cmd+B)">
            <svg class="ic-fold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
            <svg class="ic-unfold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <div class="sb-top">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" placeholder="Search threads…">
        </div>
      </div>
      <div class="sb-scroll">
        <div class="sb-section-label">Views</div>
        <div class="smart-list" id="smartList">
          <div class="smart-item active" data-view="home" data-tip="Home">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>
            <span class="lbl">Home</span><span class="cnt"></span>
          </div>
          <div class="smart-item" data-view="blocked" data-tip="Blocked">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></span>
            <span class="lbl">Blocked</span><span class="cnt">3</span>
            <span class="rail-badge">3</span>
          </div>
          <div class="smart-item" data-view="ready" data-tip="Review">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></span>
            <span class="lbl">Review</span><span class="cnt">2</span>
          </div>
          <div class="smart-item" data-view="starred" data-tip="Starred">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.9 6 6.6.9-4.8 4.6 1.1 6.5L12 18l-5.8 3 1.1-6.5L2.5 9.9 9 9z"/></svg></span>
            <span class="lbl">Starred</span><span class="cnt">3</span>
          </div>
          <div class="smart-item" data-view="folders" data-tip="All folders">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
            <span class="lbl">All Folders</span><span class="cnt"></span>
          </div>
        </div>

        <div class="folders">
          <div class="sb-section-label">Folders</div>
          <div class="folder-group">
            <div class="folder-head" onclick="toggleFolder(this)">
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
              <span class="fname">Stars — subs</span><span class="fcount">4</span>
            </div>
            <div class="folder-body" data-chats="stars"></div>
          </div>
          <div class="folder-group">
            <div class="folder-head" onclick="toggleFolder(this)">
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
              <span class="fname">Oncall</span><span class="fcount">3</span>
            </div>
            <div class="folder-body" data-chats="oncall"></div>
          </div>
          <div class="folder-group">
            <div class="folder-head collapsed" onclick="toggleFolder(this)">
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
              <span class="fname">Experiments</span><span class="fcount">2</span>
            </div>
            <div class="folder-body" data-chats="experiments"></div>
          </div>
        </div>

        <div class="recent-chats">
          <div class="sb-section-label recent-label">Recent</div>
          <div class="folder-group" data-chats="recent"></div>
        </div>

        <div class="folders archived-group">
          <div class="folder-group">
            <div class="folder-head collapsed" onclick="toggleFolder(this)">
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
              <svg class="fico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></svg>
              <span class="fname">Archived</span><span class="fcount" data-archived-count></span>
            </div>
            <div class="folder-body" data-chats="archived"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="main">
      <div class="tabstrip"><div style="display:flex;"></div></div>
      <div class="content">
        <div class="screen active" style="align-items:center;justify-content:center;">
          <div style="color:var(--text-faint);font-size:12.5px;">no session open</div>
        </div>
      </div>
    </div>
  </div>
  <div class="statusbar"><span>backend: mock</span><span>3 blocked · 12 sessions</span></div>
  </div>
</div>
<div class="phase-caption">hanabi — Phase C: sidebar list (smart views + folders + rows)</div>
<script>
const THREADS = {
  // attn = DONE or WAITING-ON-YOU  -> dot + bold
  // running = self-running          -> dimmed, calm
  // parked = muted/greyed
  t1: { title:"Multi-tier pricing rollout", state:"attn", tag:"blocked", folder:"stars", star:true,
        sub:"waiting on you · 8m", msgs:[
    {role:"system", ts:"3h", text:"Task: land the multi-tier pricing config once CI is green."},
    {role:"assistant", ts:"2h", text:"Built the config diff <b>D948120</b> adding Tier 1/2/3 price points. Running the shadow comparison against prod now."},
    {role:"tool", ts:"1h", text:"shadow_compare → 4,812 accounts · max delta 0.3% · within tolerance ✓"},
    {role:"assistant", ts:"12m", text:"All CI green, shadow matched. This is the config being added:", code:
      '<span class="cm"># pricing/tiers.cinc</span>\n<span class="kw">tiers</span> = {\n  <span class="st">"tier_1"</span>: { price_usd: 4.99 },\n  <span class="st">"tier_2"</span>: { price_usd: 9.99 },\n  <span class="st">"tier_3"</span>: { price_usd: 19.99 },\n}', after:"Nothing else is blocking. <b>I need your approval to land.</b>"},
    {role:"user", ts:"—", text:"", placeholder:true}
  ]},
  t2: { title:"Stars payout reconciliation", state:"attn", tag:"blocked", folder:"stars", star:false,
        subs:[{title:"Ledger diff scan", state:"running"},{title:"Duplicate-payout check", state:"done"}],
        sub:"waiting on you · 22m", msgs:[
    {role:"system", ts:"5h", text:"Task: reconcile this cycle's Stars payouts against the ledger before the batch runs."},
    {role:"assistant", ts:"40m", text:"Reconciled 4,812 accounts. 4,810 match to the cent. Two don't:"},
    {role:"assistant", ts:"38m", text:"", list:["acct 8842 — ledger $128.60, computed $116.20 (Δ $12.40)","acct 1097 — ledger $54.10, computed $51.00 (Δ $3.10)"]},
    {role:"assistant", ts:"22m", text:"Both look like a rounding artifact in a promo credit, but proceeding commits the batch — it's irreversible for this cycle. <b>Hold, or proceed and I'll flag the two for manual follow-up?</b>"},
  ]},
  t3: { title:"Creator welcome QP copy", state:"attn", tag:"done", folder:"stars", star:false,
        sub:"done · 1h", msgs:[
    {role:"system", ts:"2h", text:"Task: draft welcome QP copy for new Stars creators. 3 variants, brand-voice compliant."},
    {role:"assistant", ts:"1h", text:"Three variants, all passing the brand-voice check:"},
    {role:"assistant", ts:"1h", text:"", list:["A (warmest): \u201cWelcome — your fans can now support you directly. Let\u2019s set up Stars.\u201d","B (clearest): \u201cStars are on. Turn on receiving to start earning from your fans.\u201d","C (shortest): \u201cYou\u2019re in. Set up Stars \u2192\u201d"]},
    {role:"assistant", ts:"1h", text:"B scored highest on clarity; A is warmest. <b>Which ships Monday?</b>"},
  ]},
  t4: { title:"Tier upgrade flow", state:"ready", tag:"ready", folder:"experiments", star:false,
        sub:"ready for review · 30m", msgs:[
    {role:"system", ts:"4h", text:"Task: implement in-app upgrade from Tier 1 → Tier 2 with proration."},
    {role:"assistant", ts:"1h", text:"Implemented the upgrade path with a proration line item on the receipt. Wrote 18 new tests."},
    {role:"tool", ts:"35m", text:"buck test → 214 passed, 0 failed · lint clean · type check clean ✓"},
    {role:"assistant", ts:"30m", text:"Deployed to staging. <b>Test link is ready</b> — subscribe at Tier 1, upgrade to Tier 2, and confirm the proration line."},
  ]},
  t5: { title:"Payout worker race fix", state:"ready", tag:"ready", folder:"oncall", star:true,
        sub:"ready for review · 2h", msgs:[
    {role:"system", ts:"6h", text:"Task: root-cause and fix intermittent double-writes in the payout worker."},
    {role:"assistant", ts:"3h", text:"Root cause: two workers could claim the same payout row between the read and the lock. Fixed with a conditional update guard."},
    {role:"tool", ts:"2h", text:"stress_run(500) → 0 double writes · CI green ✓"},
    {role:"assistant", ts:"2h", text:"Confident it's fixed. Ready for you to verify on the test tenant."},
  ]},
  t6: { title:"Backfill entitlement table", state:"running", tag:null, folder:"experiments", star:false,
        subs:[{title:"Chunk 1–500k", state:"done"},{title:"Chunk 500k–1M", state:"running"},{title:"Row validator", state:"running"}],
        sub:"self-running · 61%", msgs:[
    {role:"system", ts:"2h", text:"Task: backfill the entitlement table for legacy subscribers."},
    {role:"assistant", ts:"5m", text:"Backfill in progress — 61% through 2.1M rows. No action needed; I'll surface it when done or if I hit a snag."},
  ]},
  t7: { title:"Tier schema migration", state:"running", tag:null, folder:"experiments", star:false,
        sub:"self-running · tests", msgs:[
    {role:"assistant", ts:"9m", text:"Running the migration test suite before applying. Quiet until there's something to decide."},
  ]},
  t8: { title:"Nightwatch: D948213", state:"running", tag:null, folder:"oncall", star:false,
        sub:"self-running · landing", msgs:[
    {role:"assistant", ts:"4m", text:"CI green on all signals. Landing the diff now — will report the SHA when it's in."},
  ]},
  t9: { title:"Weekly metrics digest", state:"running", tag:null, folder:"oncall", star:false,
        sub:"self-running", msgs:[
    {role:"assistant", ts:"1m", text:"Assembling the weekly subs metrics digest. Nothing for you yet."},
  ]},
  t10:{ title:"Old A/B: paywall color", state:"parked", tag:null, folder:"experiments", star:false,
        sub:"parked", msgs:[
    {role:"system", ts:"3w", text:"Muted. Experiment concluded — kept for reference."},
    {role:"assistant", ts:"3w", text:"Result was flat. Parked this thread; it won't ask for anything."},
  ]},
  t11:{ title:"Churn query (Q3 cohort)", state:"done", tag:"done", folder:"stars", star:true,
        sub:"done · 12m", msgs:[
    {role:"system", ts:"1h", text:"Task: pull 90-day churn for the Q3 subscriber cohort."},
    {role:"tool", ts:"14m", text:"query returned 41,208 rows · exported to results.csv ✓"},
    {role:"assistant", ts:"12m", text:"Done — 90-day churn came in at 6.2%, down 0.8pt from Q2. Results attached; want a breakdown by tier?"},
  ]},
  t12:{ title:"Docs: onboarding runbook", state:"parked", tag:null, folder:"recent", star:false,
        sub:"parked", msgs:[
    {role:"assistant", ts:"1w", text:"Muted reference thread. No attention needed."},
  ]},
  t13:{ title:"Legacy gifting migration", state:"archived", tag:null, folder:null, star:false,
        sub:"archived · 2mo", msgs:[
    {role:"system", ts:"2mo", text:"Task: migrate legacy gifting rows to the new ledger."},
    {role:"assistant", ts:"2mo", text:"Migration completed and reconciled. Archiving — nothing left to do here."},
  ]},
  t14:{ title:"2024 pricing experiment writeup", state:"archived", tag:null, folder:null, star:false,
        sub:"archived · 5mo", msgs:[
    {role:"assistant", ts:"5mo", text:"Final writeup shipped. Archived for reference."},
  ]},
};

const FOLDER_MEMBERS = {
  stars: ["t1","t2","t3","t11"],
  oncall: ["t5","t8","t9"],
  experiments: ["t4","t6","t7","t10"],
  recent: ["t1","t2","t11","t4","t6","t12"],
  archived: ["t13","t14"],
};
const FOLDER_LABEL = { stars:"Stars — subs", oncall:"Oncall", experiments:"Experiments" };

// How many threads in a set are waiting on the user (attn/done + not parked).
function waitingCount(ids){
  return ids.filter(id=>{ const t=THREADS[id]; return (t.state==="attn"||t.state==="done"); }).length;
}


const TAG_LABEL = { blocked:"Blocked", ready:"Review", done:"Done" };
function chatRowHtml(id){
  const t = THREADS[id];
  let cls = "chat-row";
  let glyph = "";
  if(t.tag==="blocked"){ cls+=" attn has-glyph"; glyph='<span class="glyph g-blocked"></span>'; }
  else if(t.tag==="ready"){ cls+=" attn has-glyph"; glyph='<span class="glyph g-review"></span>'; }
  else if(t.state==="done"||t.tag==="done"){ cls+=" attn has-glyph"; glyph='<span class="glyph g-done"></span>'; }
  else if(t.state==="attn"){ cls+=" attn has-glyph"; glyph='<span class="glyph g-blocked"></span>'; }
  else if(t.state==="running") cls+=" running";
  else if(t.state==="parked"||t.state==="archived") cls+=" parked";
  return '<div class="chat-item">'+
    '<div class="'+cls+'">'+ glyph +
      '<span class="ctitle">'+t.title+'</span>'+
    '</div></div>';
}
function toggleFolder(el){ el.classList.toggle('collapsed'); }
function renderSidebar(){
  document.querySelectorAll('[data-chats]').forEach(function(el){
    const key = el.getAttribute('data-chats');
    const ids = FOLDER_MEMBERS[key] || [];
    el.innerHTML = ids.map(chatRowHtml).join('');
  });
  document.querySelectorAll('.folder-group').forEach(function(g){
    const body = g.querySelector('.folder-body'); if(!body) return;
    const key = body.getAttribute('data-chats');
    const ids = FOLDER_MEMBERS[key] || [];
    const w = waitingCount(ids);
    const cnt = g.querySelector('.fcount'); if(!cnt) return;
    if(w>0){ cnt.textContent = w+" waiting"; cnt.classList.add('attn'); }
    else   { cnt.textContent = ids.length; cnt.classList.remove('attn'); }
  });
  const ac = document.querySelector('[data-archived-count]');
  if(ac) ac.textContent = (FOLDER_MEMBERS.archived||[]).length;
}
document.querySelectorAll('.window .sb-collapse').forEach(function(btn){
  btn.addEventListener('click', function(){ btn.closest('.window').classList.toggle('folded'); });
});
document.addEventListener('keydown', function(e){
  var meta = e.metaKey || e.ctrlKey;
  if(meta && e.key.toLowerCase()==='b'){ e.preventDefault(); document.getElementById('window').classList.toggle('folded'); }
});
renderSidebar();

</script>
</body>
</html>
