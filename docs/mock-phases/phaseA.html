<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hanabi — Phase A</title>
<link rel="stylesheet" href="../../mock/assets/hanabi.css">
<style>
/* phase-specific overrides on top of shared hanabi.css (this phase is a design SNAPSHOT — it predates some hanabi.css changes, so these rules keep its exact look) */
.titlebar .title {
  flex:1; text-align:center; font-weight:600; font-size:12.5px;
  color: var(--text-secondary); letter-spacing:0.2px;
}
.titlebar .title b { color: var(--text-primary); font-weight:700; }
/* sidebar header: brand + action icons (new task, settings, collapse) */
.sb-header {
  display:flex; align-items:center; gap:4px;
  padding: 9px 8px 5px 14px; min-height:40px; box-sizing:border-box;
}
.sb-brand { display:flex; align-items:center; gap:7px; flex:1; min-width:0; }
.sb-mark { color: var(--accent); font-size:15px; line-height:1; }
.sb-brandname {
  font-size:13.5px; font-weight:700; color: var(--text-primary);
  letter-spacing:0.2px; white-space:nowrap;
}
.sb-actions .iconbtn {
  width:26px; height:26px; border-radius:7px; color: var(--text-faint);
}
/* folded: stack the action icons vertically in the thin rail, hide brand,
   flip the collapse chevron to an expand chevron */
.window.folded .sb-header {
  flex-direction:column; gap:2px; padding:9px 0 5px; min-height:0;
}
.window.folded .sb-brand { display:none; }
/* search */
.sb-top { padding: 10px 10px 6px; }
.search {
  display:flex; align-items:center; gap:6px;
  background: var(--panel-bg-2); border:1px solid var(--border);
  border-radius:8px; padding: 5px 8px;
}
/* chat row */
.chat-row {
  display:flex; align-items:center; gap:8px; padding:3px 8px 3px 10px;
  border-radius:6px; cursor:pointer; color: var(--text-secondary);
  transition: background .1s; line-height:1.25;
}
/* status glyph — a DEDICATED SHAPE per status (not color-only), shown only
   when the thread needs attention (waiting/blocked/review/done). Self-running,
   parked and archived show nothing. */
.chat-row .glyph { width:9px; height:9px; flex:0 0 9px; margin-left:1px; position:relative; display:none; }
.chat-row.has-glyph .glyph { display:block; }
/* the working ring on a parent row sits just right of the status shape */
.chat-row .glyph.g-working { flex:0 0 9px; margin-left:-2px; border-color: var(--accent); }
/* ---- sub-agents (nested, collapsed by default) ---- */
.chat-item {}
.subtoggle { width:13px; height:13px; flex:0 0 13px; display:flex; align-items:center; justify-content:center;
  color: var(--text-faint); cursor:pointer; border-radius:4px; }
.subtoggle:hover { color: var(--text-primary); background: var(--hover-bg); }
.subtoggle .chev { width:11px; height:11px; transition: transform .12s; }
.chat-item.collapsed .subtoggle .chev { transform: rotate(-90deg); }
.subtoggle-spacer { width:13px; flex:0 0 13px; }
/* align rows without subs */
.subcount { font-size:10px; color: var(--text-faint); font-variant-numeric:tabular-nums;
  min-width:14px; text-align:right; flex:0 0 auto; }
.subrows { padding-left: 22px; }
.chat-item.collapsed .subrows { display:none; }
.subrow { display:flex; align-items:center; gap:7px; padding:2px 8px 2px 4px; border-radius:6px;
  cursor:pointer; color: var(--text-faint); position:relative; line-height:1.2; }
.subrow:hover { background: var(--hover-bg); }
.subrow .subtwig { width:8px; height:1px; background: var(--border); flex:0 0 8px; }
.subrow .ctitle { flex:1; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color: var(--text-faint); }
.subrow.running .ctitle { color: var(--text-secondary); }
.subrow.done .ctitle { color: var(--text-faint); }
.subrow .glyph { width:8px; height:8px; flex:0 0 8px; }
/* keep search hidden in folded rail */
.window.folded .sb-top { display:none; }
.phase-caption {
  position: fixed; left: 10px; bottom: 8px; z-index: 500;
  font-size: 10px; color: rgba(255,255,255,0.32); letter-spacing:0.3px;
  font-family: ui-monospace, Menlo, monospace; -webkit-user-select:none; user-select:none;
}
[data-theme="light"] .phase-caption { color: rgba(0,0,0,0.30); }
.statusbar {
  height:26px; flex:0 0 26px; display:flex; align-items:center; justify-content:space-between;
  padding:0 12px; border-top:1px solid var(--border); background:var(--sidebar-bg);
  font-size:11px; color:var(--text-secondary); -webkit-user-select:none; user-select:none;
}
</style>
</head>
<body>
<div class="macbar">
  <div class="macbar-left">
     <span class="apple"></span>
     <span class="macbar-app">hanabi</span>
     <span class="macbar-menu">File</span>
     <span class="macbar-menu">Edit</span>
     <span class="macbar-menu">View</span>
     <span class="macbar-menu">Window</span>
     <span class="macbar-menu">Help</span>
  </div>
  <div class="macbar-right">
     <span class="macbar-sys">100%</span>
     <span class="macbar-sys">Thu 1:58 PM</span>
  </div>
</div>

<div class="stage">
<div class="window" id="window">

  <div class="titlebar">
    <div class="traffic">
      <span class="light red"></span><span class="light yellow"></span><span class="light green"></span>
    </div>
    <div class="title"><b>hanabi</b></div>
  </div>

  <div class="body">
    <div class="sidebar">
      <div class="sb-header">
        <span class="sb-brand"><span class="sb-mark">✦</span><span class="sb-brandname">hanabi</span></span>
        <div class="sb-actions">
          <button class="iconbtn" data-tip="New task" title="New task">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="iconbtn" data-tip="Settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 6.8 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 5 13.6a1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 5 6.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10.4 5 1.6 1.6 0 0 0 11.5 3.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
          </button>
          <button class="iconbtn sb-collapse" id="collapseBtn" title="Toggle sidebar (Cmd+B)">
            <svg class="ic-fold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
            <svg class="ic-unfold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <div class="sb-top">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" placeholder="Search threads…">
        </div>
      </div>
      <div class="sb-scroll">
        <!-- Phase A: empty sidebar body (no data) -->
      </div>
    </div>

    <div class="main">
      <div class="tabstrip" id="tabstrip">
        <div id="tabs" style="display:flex;"></div>
      </div>
      <div class="content" id="content">
        <div class="screen active" style="align-items:center;justify-content:center;">
          <div style="color:var(--text-faint);font-size:12.5px;">no session open</div>
        </div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span class="sb-left">backend: mock</span>
    <span class="sb-right">0 sessions</span>
  </div>

  </div><!-- /#window -->
</div>
<div class="phase-caption">hanabi — Phase A: shell</div>
<script>
/* Phase A: no interactions — static shell only. */
</script>
</body>
</html>
